@if (toastService.toast(); as toast) {
<div class="fixed right-5 bottom-5 z-[9999] flex min-w-72 max-w-md
           items-center justify-between gap-4 rounded-lg p-4
           text-white shadow-lg" [class.bg-green-600]="toast.type === 'success'"
    [class.bg-red-500]="toast.type === 'error'" [class.bg-yellow-500]="toast.type === 'warning'"
    [class.bg-blue-600]="toast.type === 'info'" role="alert" aria-live="polite">
    <span>{{ toast.message }}</span>

    <button type="button" class="text-xl font-bold hover:opacity-75" aria-label="Close notification"
        (click)="toastService.clear()">
        &times;
    </button>
</div>
}
